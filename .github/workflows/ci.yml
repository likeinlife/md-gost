# Сборка артефактов и проверки стиля.
# Ruff 0.16.8 и wemake-python-styleguide 1.9.0 — как в .pre-commit-config.yaml.
# Pyrefly 1.4.1 — как в packages/idef0/uv.lock.
# Push только в main: иначе один коммит в pull request запускает workflow дважды.

name: Сборка и проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.8"
  WPS_VERSION: "1.9.0"
  PYREFLY_VERSION: "1.4.1"

jobs:
  checks:
    name: Ruff, WPS, Pyrefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Ruff и wemake-python-styleguide
        run: |
          status=0
          echo "::group::ruff check"
          uvx "ruff==${RUFF_VERSION}" check . || status=1
          echo "::endgroup::"
          echo "::group::ruff format"
          uvx "ruff==${RUFF_VERSION}" format --check . || status=1
          echo "::endgroup::"
          for package in packages/md-gost packages/md-gost-lint packages/md-gost-build packages/idef0; do
            echo "::group::wemake-python-styleguide ($package)"
            if ! uvx --from flake8 --with "wemake-python-styleguide==${WPS_VERSION}" flake8 --config="$package/setup.cfg" "$package"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Pyrefly
        run: |
          status=0
          for package in packages/md-gost packages/md-gost-lint packages/md-gost-build packages/idef0; do
            echo "::group::$package"
            if ! (
              cd "$package" &&
              uv sync --project . --frozen --group dev --no-install-project &&
              uvx "pyrefly==${PYREFLY_VERSION}" check --python-interpreter-path .venv/bin/python
            ); then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Собрать wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  vscode:
    name: VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Собрать VSIX
        run: |
          npm ci
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error

  zed:
    name: Zed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed

      - name: Собрать extension.wasm
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Упаковать расширение
        run: |
          cp target/wasm32-wasip2/release/md_gost_lsp.wasm extension.wasm
          tar -czf md-gost-lsp.tar.gz extension.toml extension.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: zed-extension
          path: editors/zed/md-gost-lsp.tar.gz
          if-no-files-found: error
