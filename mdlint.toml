# Базовая конфигурация md-lint (packages/md-gost-lint). Уровни: "error", "warning", "off".
# Каждая работа может положить свой mdlint.toml рядом с book.toml — он
# переопределяет то, что задано здесь, и действует только на её каталог.
# Полный список правил: md-gost lint --list-rules

[rules]
# Глобальные переопределения уровней ставятся здесь.

# example/ — фикстура сборщика: она демонстрирует синтаксис разметки, а не
# правила изложения, поэтому прозаические проверки к ней не применяются.
[paths."example/*"]
STRUCT001 = "off"
STRUCT002 = "off"
STRUCT003 = "off"
STRUCT004 = "off"
STYLE001 = "off"
REF005 = "off"
REF006 = "off"
REF008 = "off"
REF009 = "off"
BIB001 = "off"
BIB002 = "off"
