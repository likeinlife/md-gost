# Точка входа md-gost. Сама ничего не проверяет и не собирает:
# lint/format/lsp живут в md-gost-lint, сборка — в md-gost-build,
# разбор DOCX — в md-gost-postlint.
#
#   uv run --group dev pytest

[project]
name = "md-gost"
version = "0.1.0"
description = "Единая команда сборки и проверки Markdown учебных работ"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "pypandoc>=1.17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../md-gost-lint", "../md-gost-build", "../md-gost-postlint"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# D203/D213 несовместимы с D211/D212; Ruff оставляет вторую пару.
ignore = ["CPY001", "D203", "D213"]
# Кириллица и русская пунктуация в строках, docstring и комментариях.
allowed-confusables = ["А", "Б", "В", "Г", "Д", "Е", "Ж", "З", "И", "Й", "К", "Л", "М", "Н", "О", "П", "Р", "С", "Т", "У", "Ф", "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э", "Ю", "Я", "а", "б", "в", "г", "д", "е", "ж", "з", "и", "й", "к", "л", "м", "н", "о", "п", "р", "с", "т", "у", "ф", "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я", "Ё", "ё", "–", "—"]

[tool.ruff.lint.per-file-ignores]
# В тестах docstring не обязателен, assert разрешён.
# INP001: каталог tests не является пакетом.
"tests/**" = ["S101", "D", "INP001", "S603"]
# Флаги Typer объявляются позиционными параметрами функции: так устроен декоратор.
"md_gost/cli.py" = ["FBT", "PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["md_gost", "gost_lint", "gost_builder", "gost_docx_lint"]

# cli.py импортирует соседние пакеты. Ближайший pyproject для ty — этот каталог,
# поэтому корни поиска заданы и здесь, относительно packages/md-gost.
[tool.ty.environment]
python = "../../.venv"
root = [".", "../md-gost-lint", "../md-gost-build", "../md-gost-postlint"]

[tool.pyrefly]
preset = "strict"
project-includes = ["**/*.py"]
project-excludes = ["**/__pycache__/**"]
python-version = "3.11"
search-path = [".", "tests", "../md-gost-lint", "../md-gost-build", "../md-gost-postlint"]
